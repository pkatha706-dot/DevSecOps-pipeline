name: DevSecOps Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # Stage 1: Secret scanning across full git history
  secret-scan:
    name: TruffleHog Secret Scan
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run TruffleHog
        run: |
          pip install trufflehog3
          trufflehog3 . --format json --output trufflehog-report.json || true
      - name:  Upload TruffleHog report
        uses: actions/upload-artifact@v4
        with:
          name: trufflehog-report
          path: trufflehog-report.json

  # Stage 2: SAST with Bandit
  sast:
    name: Bandit SAST
    runs-on: ubuntu-latest
    needs: secret-scan
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Bandit
        run: pip install bandit

      - name: Run Bandit
        run: |
          bandit -r app/ \
            --severity-level medium \
            --format json \
            --output bandit-report.json || true

      - name: Upload Bandit report
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json

  # Stage 3: SCA with Snyk
  sca:
    name: Snyk SCA
    runs-on: ubuntu-latest
    needs: sast
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Snyk CLI
        run: npm install -g snyk

      - name: Install dependencies
        run: pip install -r app/requirements.txt
        
      - name: Run Snyk
        run: |
          snyk auth ${{ secrets.SNYK_TOKEN }}
          snyk test --file=app/requirements.txt \
            --severity-threshold=high \
            --json > snyk-report.json || true 
        

      - name: Upload Snyk report
        uses: actions/upload-artifact@v4
        with:
          name: snyk-report
          path: snyk-report.json

  # Stage 4: IaC scan with Checkov
  iac-scan:
    name: Checkov IaC Scan
    runs-on: ubuntu-latest
    needs: sca
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          file: Dockerfile
          soft_fail: false
          output_format: json
          output_file_path: checkov-report.json

      - name: Upload Checkov report
        uses: actions/upload-artifact@v4
        with:
          name: checkov-report
          path: checkov-report.json

  # Stage 5: Docker build and save image artifact
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: iac-scan
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t devsecops-app:${{ github.sha }} .

      - name: Save Docker image
        run: docker save devsecops-app:${{ github.sha }} | gzip > devsecops-image.tar.gz

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: devsecops-image.tar.gz

  # Stage 6: Container scan with Trivy
  container-scan:
    name: Trivy Container Scan
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Load Docker image
        run: docker load < devsecops-image.tar.gz

      - name: Run Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: devsecops-app:${{ github.sha }}
          format: json
          output: trivy-report.json
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Upload Trivy report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report.json

  # Stage 7: Deploy Flask app locally for DAST
  dast-deploy:
    name: Deploy for DAST
    runs-on: ubuntu-latest
    needs: container-scan
    outputs:
      app_ready: ${{ steps.healthcheck.outputs.ready }}
    steps:
      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Load Docker image
        run: docker load < devsecops-image.tar.gz

      - name: Start application container
        run: docker run -d --name devsecops-app -p 5000:5000 devsecops-app:${{ github.sha }}

      - name: Wait for health check
        id: healthcheck
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5000/health; then
              echo "ready=true" >> $GITHUB_OUTPUT
              exit 0
            fi
            echo "Attempt $i: app not ready yet, waiting 2s..."
            sleep 2
          done
          echo "App failed to start after 60 seconds"
          docker logs devsecops-app
          exit 1

  # Stage 8: DAST with OWASP ZAP
  dast:
    name: OWASP ZAP Baseline Scan
    runs-on: ubuntu-latest
    needs: dast-deploy
    permissions: 
      issues: write
      contents: read
    continue-on-error: true
    steps:
      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Load Docker image
        run: docker load < devsecops-image.tar.gz

      - name: Start application container
        run: docker run -d --name devsecops-app -p 5000:5000 devsecops-app:${{ github.sha }}

      - name: Wait for application to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5000/health; then
              exit 0
            fi
            sleep 2
          done
          echo "App failed to start" && exit 1

      - name: Run ZAP Scan
        run: |
          mkdir -p $(pwd)/zap-output
          chmod 777 $(pwd)/zap-output
          docker run --network host \
            -v $(pwd)/zap-output:/zap/wrk/:rw \
            --user root \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t http://localhost:5000/health \
            -J zap-report.json \
            -I || true
            
      - name: Copy ZAP report
        run: cp $(pwd)/zap-output/zap-report.json ./zap-report.json || true

      - name: Upload ZAP report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-scan-results
          path: zap-report.json

  # Stage 9: AI-assisted vulnerability triage (manual trigger only — avoids
  # burning Gemini API quota on every push)
  ai-triage:
    name: AI Triage
    runs-on: ubuntu-latest
    needs: dast
    if: always() && github.event_name == 'workflow_dispatch'
    continue-on-error: true
    permissions:
      issues: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install google-genai requests

      - name: Download Bandit report
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: bandit-report
          path: reports

      - name: Download Snyk report
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: snyk-report
          path: reports

      - name: Download Trivy report
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: trivy-report
          path: reports

      - name: Download ZAP report
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: zap-scan-results
          path: reports

      - name: Run AI triage
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          REPORTS_DIR: reports
        run: python ai_triage/ai_triage.py
